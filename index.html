<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winterbergstüble - Ausflugslokal & Sportgaststätte</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f8f8;
            color: #000;
        }

        .header {
            display: flex;
            align-items: center;
            padding: 12px;
            background-color: #f8f8f8;
            border-bottom: 2px solid #000;
            justify-content: center;
        }

        /* Logo responsive */
        .logo {
            height: auto;
            width: 100%;
            max-width: 360px;
            max-height: 140px;
        }

        .content {
            display: flex;
            gap: 20px;
            justify-content: space-between;
            max-width: 1100px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            align-items: flex-start;
            border-radius: 10px;
        }

        .info {
            flex: 1;
            padding-right: 20px;
        }

        .menu {
            flex: 1;
            text-align: center;
        }

        .menu-link {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #000;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }

        .menu-link:hover {
            background-color: #444;
        }

        /* Buttons auf Handy schön breit */
        .menu-link {
            width: 100%;
            max-width: 320px;
            text-align: center;
        }

        .reservation {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-color: white;
            padding: 20px;
            margin: 30px auto;
            max-width: 500px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .social-links {
            margin-top: 20px;
            text-align: center;
            padding-bottom: 30px;
        }

        .social-links a {
            text-decoration: none;
            color: #000;
            font-weight: bold;
            margin: 0 10px;
        }

        .social-links a:hover {
            color: #444;
        }

        .social-links .separator {
            display: inline-block;
            width: 1px;
            height: 16px;
            background-color: #000;
            margin: 0 10px;
        }

        /* Weihnachtsbanner etwas schöner */
        .xmas-banner {
            text-align: center;
            background: #fff;
            margin: 20px auto;
            padding: 15px;
            max-width: 800px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-top: 4px solid #b30000; /* dezenter Weihnachts-Akzent */
        }

        /* Responsive: auf kleineren Geräten untereinander */
        @media (max-width: 900px) {
            .content {
                flex-direction: column;
                padding: 16px;
                margin: 16px;
            }
            .info {
                padding-right: 0;
            }
            .menu {
                text-align: left;
            }
        }
</head>

<body>

    <!-- Header -->
    <div class="header">
        <img class="logo" src="logo2.jpg" alt="Winterbergstüble Logo">
    </div>

    <!-- Weihnachtsbanner -->
    <div class="xmas-banner">
        <h2 style="margin:0;">🎄 Frohe Weihnachten & Guten Rutsch ins 2026 🎆</h2>
        <p style="margin:5px 0 0;">
            Wir wünschen Ihnen schöne Feiertage und freuen uns auf Ihren Besuch!
        </p>
    </div>

    <!-- Hauptinhalt -->
    <div class="content">
        <div class="info">

            <p>31.12.2025: <strong>geschlossen</strong></p>
            <p>01.01.2026: <strong>geschlossen</strong></p>
        </div>

        <div class="menu">
            <h3>Unsere Speisekarten</h3>

            <a class="menu-link" href="Speisekarte.pdf" target="_blank">
                Speisekarte ansehen
            </a>

            <br><br>

            <a class="menu-link" href="Weihnachtskarte.pdf" target="_blank">
                Weihnachtskarte ansehen
            </a>

            <p style="margin-top:20px;">
                Essen zum Mitnehmen ist bei den meisten Gerichten möglich.<br>
                Rufen Sie uns an unter:<br>
                <strong><a href="tel:+4983829890885" style="color:#000; text-decoration:none;">08382 9890885</a></strong>
            </p>
        </div>
    </div>

    <!-- Reservierung -->
    <div class="reservation">
        <h3>Reservierungen</h3>
        <p><strong>Telefon:</strong> <a href="tel:+4983829890885" style="color:#000; text-decoration:none;">08382 9890885</a></p>
        <p><strong>E-Mail:</strong> <a href="mailto:winterbergstueble@gmail.com" style="color:#000; text-decoration:none;">winterbergstueble@gmail.com</a></p>
    </div>

    <!-- Social Media -->
    <div class="social-links">
        <p>Folgen Sie uns auf:</p>
        <a href="https://www.instagram.com/winterbergstueble/" target="_blank">Instagram</a>
        <span class="separator"></span>
        <a href="https://www.facebook.com/Winterbergstueble" target="_blank">Facebook</a>
    </div>

</body>
</html>
